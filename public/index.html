<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ShopEase - E-Commerce Store</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <!-- NAVBAR -->

    <header class="navbar">

        <div class="logo">
            ShopEase
        </div>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="cart.html">
                Cart
                (<span id="cartCount">0</span>)
            </a>

            <a href="login.html">
                Login
            </a>

            <a href="register.html">
                Register
            </a>

        </nav>

    </header>


    <!-- HERO SECTION -->

    <section class="hero">

        <h1>
            Welcome to ShopEase

        <a href="#products" class="btn">

    <main class="container">

        </h2>

        <div

    <footer>
