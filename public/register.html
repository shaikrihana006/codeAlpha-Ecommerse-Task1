<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register - ShopEase</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <header class="navbar">

        <div class="logo">
            ShopEase
        </div>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="login.html">
                Login
            </a>

        </nav>

    </header>


    <div class="form-container">

        <h2>
            Create Account
        </h2>


        <form id="registerForm">

            <div class="form-group">

                <label>
                    Name
                </label>

                <input
                    type="text"
                    id="name"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn btn-primary"
            >
                Register
            </button>

        </form>


        <p id="message"></p>

    </div>


    <script src="js/auth.js"></script>

</body>

</html>
